# 自販機.net — /columns → drafity vender
# 親LPはトップ(/)と同じなので X-Brand-Lp-Path は不要
# パンくず: トップ → 自販機設置記事一覧 → 記事

location ^~ /columns {
    proxy_set_header Host drafity.pro;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Accept-Encoding "";
    proxy_pass https://drafity.pro/vender/columns;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_read_timeout 90;

    sub_filter_types text/html text/css application/javascript;
    sub_filter 'https://drafity.pro' 'https://xn--new351c2sh.net';
    sub_filter 'http://drafity.pro' 'https://xn--new351c2sh.net';
    sub_filter '/assets_ok/' '/remote-assets/';
    sub_filter '/assets/' '/remote-assets/';
    sub_filter '/vender/columns' '/columns';
    sub_filter_once off;
    proxy_cookie_domain drafity.pro xn--new351c2sh.net;
}
